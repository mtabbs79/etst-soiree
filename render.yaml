# One-click Render setup: web app + Postgres database.
services:
  - type: web
    name: etst-soiree
    runtime: node
    plan: starter          # always on (free plan sleeps after 15 min idle)
    region: virginia       # closest Render region to Miami
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: etst-soiree-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false        # you'll be asked for this during setup
      - key: CONTACT_EMAIL
        sync: false
databases:
  - name: etst-soiree-db
    plan: basic-256mb      # paid tier; free databases are deleted after 30 days
    region: virginia
    databaseName: etst_soiree
    user: etst
